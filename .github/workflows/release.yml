name: Release app

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
    contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [{ name: "windows", image: "windows-latest" }]

    runs-on: ${{ matrix.os.image }}

    steps:
      - name: Github checkout
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - run: npm ci

      - name: Publish app
        env:
          GITHUB_TOKEN: ${{ github.token}}
          SENTRY_AUTH_TOKEN: ${{secrets.SENTRY_AUTH_TOKEN}}
        run: npm run publish
