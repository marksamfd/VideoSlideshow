<!DOCTYPE html>
<html lang="en" class="h-100" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>ChoirSlides - Presenter</title>
    <style>
      .slide-thumbnail {
        border: 2px solid transparent;
        border-radius: 8px;
        transition: all 0.3s ease;
        cursor: pointer;
      }
      .slide-thumbnail:hover {
        border-color: var(--bs-primary);
      }
      .slide-thumbnail.active {
        border-color: var(--bs-success);
        box-shadow: 0 0 10px rgba(25, 135, 84, 0.5);
      }
      .video-canvas {
        background: #000;
        border-radius: 8px;
        min-height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #666;
      }
      /* Slide item styles */
      .slide-item {
        background: var(--bs-dark);
        border: 1px solid var(--bs-secondary);
        border-radius: 8px;
        margin-bottom: 8px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .slide-item:hover {
        border-color: var(--bs-primary);
      }

      .slide-item:has(input[type="radio"]:checked) {
        border-color: var(--bs-success);
        background: rgba(25, 135, 84, 0.1);
      }

      .slide-preview {
        height: 10rem;
        background-repeat: round !important;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        color: #666;
        border-bottom: 1px solid var(--bs-secondary);
      }

      .slide-content {
        padding: 8px;
        max-height: 80px;
        overflow: hidden;
      }

      .slide-text-preview {
        font-size: 0.75rem;
        line-height: 1.2;
        color: var(--bs-light);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .slide-number {
        position: absolute;
        top: 5px;
        left: 5px;
        background: rgba(13, 110, 253, 0.8);
        color: white;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.7rem;
        font-weight: bold;
      }
    </style>
  </head>

  <body class="m-0 bg-dark text-light">
    <div class="container-fluid h-100">
      <div class="row h-100">
        <!-- Main Content Area -->
        <div class="col-8 d-flex flex-column h-100" id="slidePreview">
          <!-- Video Preview Area -->
          <div class="row flex-grow-1 mb-3">
            <div class="col">
              <div class="card bg-dark border-secondary h-100">
                <div class="card-header">
                  <h6 class="mb-0 d-flex align-items-center">
                    <span class="material-symbols-outlined me-2 mb-0"
                      >videocam</span
                    >
                    Presenter View
                  </h6>
                </div>
                <div class="card-body">
                  <div
                    class="ratio-16x9 h-100 w-100 d-flex justify-content-center"
                    id="currentSlideThumbCanvas"
                  ></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Lyrics Area -->
          <div class="row" style="height: 40%">
            <div class="col">
              <div class="card bg-dark border-secondary h-100">
                <div class="card-header">
                  <h6 class="mb-0 d-flex align-items-center">
                    <span class="material-symbols-outlined me-2"
                      >text_fields</span
                    >
                    Lyrics
                  </h6>
                </div>
                <div class="card-body p-2" id="slideTextEditor">
                  <div class="row h-100">
                    <div class="col" id="textSlidesContainer">
                      <ul id="lyricsList">
                        <li data-textSlideNumber="0" class="active-text-slide">
                          Press File then Open Show
                        </li>
                      </ul>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Sidebar - Slides Manager -->
        <div
          class="col h-100 d-flex flex-column overflow-y-hidden"
          id="sideBar"
        >
          <div class="card bg-dark border-secondary h-100">
            <div class="card-header">
              <h6 class="mb-0 d-flex align-items-center">
                <span class="material-symbols-outlined me-2">view_list</span>
                Slides
              </h6>
            </div>
            <div class="flex-grow-1 overflow-auto">
              <div class="list-group" id="sidebarSlidesContainer">
                <!-- Slides will be dynamically added here -->
                <div
                  class="list-group-item list-group-item-action bg-dark border-secondary text-center text-muted py-4"
                >
                  <span
                    class="material-symbols-outlined"
                    style="font-size: 2rem"
                    >slide_show</span
                  >
                  <p class="mb-0 mt-2">
                    Open a presentation to view.
                  </p>
                </div>
              </div>
            </div>

            <div class="mt-2 p-2 bg-secondary bg-opacity-25 rounded">
              <small class="text-muted">
                <span
                  class="material-symbols-outlined me-1"
                  style="font-size: 1rem"
                  >info</span
                >
                Total slides: <span id="slideCount">0</span>
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
